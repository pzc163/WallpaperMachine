function reset(){const e=host.environment,s=Math.min(e.dpr,2,Math.sqrt(e.maxPixels/(e.width*e.height)),4096/Math.max(e.width,e.height));canvas.width=1;canvas.height=1;w=canvas.width=Math.floor(e.width*s);h=canvas.height=Math.floor(e.height*s);seed=714;agents=[];field.fill(0);ctx.fillStyle='#010407';ctx.fillRect(0,0,w,h);
 for(let i=0;i<2400;i++){const a=random()*Math.PI*2,r=Math.sqrt(random())*.43;agents.push({x:w*(.5+Math.cos(a)*r),y:h*(.5+Math.sin(a)*r),a:a+Math.PI*.5,band:i%3});}for(let i=0;i<18;i++)draw(1/30);}

function draw(dt){t+=dt*p.speed;ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(1,4,7,'+p.fade+')';ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='lighter';const cursor=host.cursor;const colors=[p.tint,p.accent,'#597a8d'];
 for(let band=0;band<3;band++){ctx.beginPath();for(let i=band;i<Math.min(2400,p.density);i+=3){const a=agents[i];if(!a)continue;const f=sense(a,a.a),l=sense(a,a.a-.5),r=sense(a,a.a+.5);a.a+=(r-l)*.075+(f<Math.max(l,r)?(r>l?.13:-.13):0);a.a+=Math.sin(a.x/w*11+Math.cos(a.y/h*13)+t*.14)*.035;
 const dx=cursor.x*w-a.x,dy=cursor.y*h-a.y,d=Math.hypot(dx,dy);if(cursor.active>.02&&d<Math.min(w,h)*.4)a.a+=Math.sin(Math.atan2(dy,dx)-a.a)*p.attraction*cursor.active*.07;
 const x=a.x,y=a.y,step=dt*p.speed*Math.min(w,h)*.09;a.x+=Math.cos(a.a)*step;a.y+=Math.sin(a.a)*step;if(a.x<0||a.x>w||a.y<0||a.y>h){a.x=w*.5;a.y=h*.5;a.a=random()*6.28;continue;}ctx.moveTo(x,y);ctx.lineTo(a.x,a.y);const ix=Math.min(95,Math.floor(a.x/w*96)),iy=Math.min(63,Math.floor(a.y/h*64));field[iy*96+ix]=Math.min(8,field[iy*96+ix]+.12);}
 ctx.strokeStyle=colors[band];ctx.globalAlpha=.28;ctx.lineWidth=Math.max(.45,w/1400);ctx.shadowColor=colors[band];ctx.shadowBlur=p.glow;ctx.stroke();}ctx.shadowBlur=0;ctx.globalAlpha=1;
 for(let y=1;y<63;y++)for(let x=1;x<95;x++){const i=y*96+x;next[i]=(field[i]*4+field[i-1]+field[i+1]+field[i-96]+field[i+96])*.121;}const swap=field;field=next;next=swap;}
host.onParameters(v=>{p={...{"speed":1,"density":2000,"sense":13,"attraction":1,"fade":0.06,"glow":4,"tint":"#638bd1","accent":"#d2a862"},...v};if(agents.length)draw(1/30)});host.onResize(reset);host.onFrame(draw);
